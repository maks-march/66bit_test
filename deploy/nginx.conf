# Nginx для Blazor WASM: статика + SPA-fallback.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # SPA: неизвестный путь отдаёт index.html, роутинг разбирает клиент.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Blazor подхватывает .wasm только с корректным Content-Type.
        location ~ \.wasm$ {
            types {}
            default_type application/wasm;
        }
    }
}
