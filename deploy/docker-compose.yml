services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techstore}
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10 }

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-techstore};Username=${POSTGRES_USER:-techstore};Password=${POSTGRES_PASSWORD}
      FileStorage__RootPath: /data/uploads
      FileStorage__PublicPrefix: /uploads
      Cors__AllowedOrigins: http://localhost:${WEB_PORT:-8090}
      Seed__Enabled: "${SEED_ENABLED:-true}"
    ports: ["${API_PORT:-8080}:8080"]
    volumes: [uploads:/data/uploads]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args: { API_BASE_URL: "http://localhost:${API_PORT:-8080}" }  # вшивается в wwwroot/appsettings.json
    depends_on: [api]
    ports: ["${WEB_PORT:-8090}:80"]

volumes: { pgdata:, uploads: }